[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlfluff-lsp"
version = "2.0.0"
description = "Persistent SQLFluff language server and MCP server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sqlfluff>=4.0,<5",
    "pygls>=1.3,<2",
    "mcp>=1.2",
]

[project.optional-dependencies]
dbt = ["sqlfluff-templater-dbt>=4.0,<5"]
fast = ["sqlfluff[rs]>=4.0,<5"]

[project.scripts]
sqlfluff-lsp = "sqlfluff_lsp.cli:main"
sqlfluff-mcp = "sqlfluff_lsp.cli:mcp_main"

[tool.setuptools.packages.find]
include = ["sqlfluff_lsp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
