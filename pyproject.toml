[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlfluff-lsp"
version = "2.0.0"
description = "Persistent SQLFluff language server and MCP server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2",
    "pygls>=2.1,<3",
    "sqlfluff>=4.3,<5",
]

[project.optional-dependencies]
dbt = ["sqlfluff-templater-dbt>=4.3,<5"]
fast = ["sqlfluff[rs]>=4.3,<5"]

[dependency-groups]
test = [
    "dbt-duckdb",
    "pyhamcrest",
    "pytest",
    "pytest-asyncio",
    "python-jsonrpc-server",
]
lint = [
    "black",
    "isort",
    "pylint",
]

[project.scripts]
sqlfluff-lsp = "sqlfluff_lsp.cli:main"
sqlfluff-mcp = "sqlfluff_lsp.cli:mcp_main"

[tool.setuptools.packages.find]
include = ["sqlfluff_lsp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
