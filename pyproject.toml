[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlfluff-lsp"
version = "2.0.0"
description = "Persistent SQLFluff language server and MCP server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lsprotocol>=2025,<2026",
    "mcp>=1.2",
    "pygls>=2.1,<3",
    "sqlfluff>=4.3,<5",
]

[project.optional-dependencies]
dbt = ["sqlfluff-templater-dbt>=4.3,<5"]
fast = ["sqlfluff[rs]>=4.3,<5"]

[dependency-groups]
test = [
    "dbt-duckdb",
    "pyhamcrest",
    "pytest",
    "pytest-asyncio",
    "python-jsonrpc-server",
]
lint = [
    "nox",
    "pyright>=1.1.410,<2",
    "ruff>=0.16.3,<0.17",
]

[project.scripts]
sqlfluff-lsp = "sqlfluff_lsp.cli:main"
sqlfluff-mcp = "sqlfluff_lsp.cli:mcp_main"

[tool.setuptools.packages.find]
include = ["sqlfluff_lsp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
package = true
python-preference = "managed"
exclude-newer = "3 days"

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = [
    "bundled/protocol",
    "src/test/python_tests/test_data",
]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "PTH",
    "B",
    "S",
    "N",
    "C4",
    "D",
    "PGH",
    "Q",
    "SIM",
]
ignore = [
    "D100",
    "D104",
    "D107",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"src/test/python_tests/**/*.py" = [
    "D",
    "PTH",
    "S101",
    "S110",
    "S311",
    "S603",
    "SIM105",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = [
    "bundled/tool/lsp_server.py",
    "sqlfluff_lsp",
]
exclude = [
    ".git",
    ".nox",
    ".venv",
    "bundled/protocol",
    "node_modules",
]
typeCheckingMode = "basic"
