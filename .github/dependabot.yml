version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: /
    schedule:
      interval: monthly
    labels:
      - 'no-changelog'
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: 'uv'
    directory: /
    schedule:
      interval: daily
    labels:
      - 'no-changelog'
    cooldown:
      default-days: 14
      semver-major-days: 30
    groups:
      python-minor-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      python-major:
        patterns:
          - '*'
        update-types:
          - 'major'

  - package-ecosystem: 'npm'
    directory: /
    schedule:
      interval: monthly
    labels:
      - 'no-changelog'
    cooldown:
      default-days: 14
      semver-major-days: 30
    groups:
      npm-minor-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      npm-major:
        patterns:
          - '*'
        update-types:
          - 'major'
    ignore:
      - dependency-name: '@types/vscode'
      - dependency-name: '@types/node'
      - dependency-name: 'vscode-languageclient'
