# Toolchain for development and testing.
# Python: 3.10 is the minimum supported runtime (requires-python in
# pyproject.toml); 3.14 is the current development default. uv is the
# dependency manager. Node stays outside mise (npm per package.json).
[tools]
python = ["3.10", "3.14"]
uv = "0.12"

[tasks.bundle]
description = "Build the bundled LSP protocol runtime"
run = "uvx nox -s setup"

[tasks.bump]
description = "Update Python and npm dependencies within declared version ranges"
run = [
	"uv lock --upgrade",
	"npm update --lockfile-version=2",
]

[tasks.bump-version]
description = "Set the npm, Python package, and runtime release version"
usage = 'arg "<version>" help="Release version in MAJOR.MINOR.PATCH format"'
run = 'python scripts/bump_version.py "${usage_version?}"'

[tasks.package]
description = "Build the VS Code extension package"
depends = ["bundle"]
run = "npm run vsce-package"

[tasks.publish]
description = "Publish the packaged extension to the VS Code Marketplace"
depends = ["package"]
run = "npx vsce publish --packagePath sqlfluff.vsix"
